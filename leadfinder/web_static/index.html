<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Enfolo Lead Finder</title>
<link rel="icon" href="data:,">
<script>try { const t = localStorage.getItem("lf2_theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch {}</script>
<style>
:root{--bg:#f5f6f8;--panel:#fff;--panel2:#fafbfc;--ink:#18202e;--muted:#6b7280;--line:#e5e7eb;--accent:#2f5bd3;--accent-ink:#fff;--soft:#eef2ff;
--ok:#0f7b55;--ok-soft:#e7f6ef;--warn:#b45309;--warn-soft:#fff4e5;--bad:#b42318;--bad-soft:#fdecea;--code:#0f172a;--codeink:#e2e8f0;
--shadow:0 1px 2px rgba(16,24,40,.06);--shadow2:0 12px 32px rgba(16,24,40,.18)}
:root[data-theme="dark"]{--bg:#0d1117;--panel:#161b22;--panel2:#11161d;--ink:#e6edf3;--muted:#8b949e;--line:#2a313c;--accent:#7b98ff;--accent-ink:#0d1117;
--soft:#1c2540;--ok:#3fb950;--ok-soft:#12261b;--warn:#d29922;--warn-soft:#2a2111;--bad:#f85149;--bad-soft:#2d1517;--code:#0a0e13;--codeink:#c9d1d9;--shadow:none;--shadow2:0 12px 32px rgba(0,0,0,.5)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1117;--panel:#161b22;--panel2:#11161d;--ink:#e6edf3;--muted:#8b949e;--line:#2a313c;--accent:#7b98ff;--accent-ink:#0d1117;
--soft:#1c2540;--ok:#3fb950;--ok-soft:#12261b;--warn:#d29922;--warn-soft:#2a2111;--bad:#f85149;--bad-soft:#2d1517;--code:#0a0e13;--codeink:#c9d1d9;--shadow:none;--shadow2:0 12px 32px rgba(0,0,0,.5)}}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
a{color:var(--accent)}h1,h2,h3{margin:0}button{font:inherit}
.app{display:grid;grid-template-columns:268px minmax(0,1fr);min-height:100vh}
.side{background:var(--panel);border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:10px;position:sticky;top:0;height:100vh}
@media (max-width:860px){.app{display:block}.side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}.slist{max-height:170px}}
.brand{font-weight:700;font-size:15px;padding:0 6px 6px}.brand span{color:var(--muted);font-weight:400;font-size:12px;display:block}
.slist{display:flex;flex-direction:column;gap:4px;overflow:auto}
.sitem{padding:9px 10px;border-radius:10px;cursor:pointer;border:1px solid transparent}.sitem:hover{background:var(--soft)}
.sitem.on{background:var(--soft);border-color:var(--line)}.sitem b{display:block;font-size:13px}.sitem small{color:var(--muted)}
.sidefoot{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding:0 4px}
.content{padding:24px 28px;max-width:1240px;width:100%;min-width:0}@media (max-width:860px){.content{padding:16px}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.muted{color:var(--muted)}.small{font-size:12px}.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
.btn{white-space:nowrap;background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:9px 15px;cursor:pointer;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.big{font-size:16px;padding:13px 22px}.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}.btn.ghost:hover{background:var(--soft)}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}.btn:disabled{opacity:.5;cursor:not-allowed}
.linkbtn{background:none;border:0;color:var(--muted);cursor:pointer;padding:4px 2px;text-align:left;font-size:12px}.linkbtn:hover{color:var(--ink)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%}
textarea{min-height:100px;resize:vertical}label.f{display:block;font-weight:600;margin:14px 0 6px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.row>*{flex:1}
.ex{display:inline-block;margin:4px 6px 0 0;padding:5px 10px;border-radius:999px;background:var(--soft);cursor:pointer;font-size:12px}
.choice{display:flex;gap:10px;flex-wrap:wrap}.choice label{flex:1 1 220px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
.choice input{width:auto;margin-right:6px}.choice label.on{border-color:var(--accent);background:var(--soft)}
.hdr{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}.hdr .acts{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.persona{border-left:3px solid var(--accent);padding:4px 12px;margin:10px 0;white-space:pre-wrap}
.chip{display:inline-block;padding:2px 9px;border-radius:999px;background:var(--soft);font-size:11px;white-space:nowrap}
.steps{display:grid;gap:2px}.step{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:start;padding:8px 4px;border-bottom:1px dashed var(--line)}.step:last-child{border-bottom:0}
.ico{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;border:2px solid var(--line);color:var(--muted)}
.ico.done{background:var(--ok);border-color:var(--ok);color:#fff}.ico.failed{background:var(--bad);border-color:var(--bad);color:#fff}.ico.warn{background:var(--warn);border-color:var(--warn);color:#fff}
.ico.running{border-color:var(--accent);border-top-color:transparent;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.summarybar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.runsummary .sumtext{white-space:pre-wrap;line-height:1.55;font-size:14px}
pre.log{background:var(--code);color:var(--codeink);padding:12px;border-radius:10px;max-height:45vh;overflow:auto;white-space:pre-wrap;font-size:12px}
details summary{cursor:pointer;font-weight:600;padding:4px 0;font-size:13px}.empty{text-align:center;padding:40px;color:var(--muted)}
.banner{border-radius:12px;padding:12px 14px;margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--soft)}
.banner.warn{background:var(--warn-soft)}
.tabs{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:3px}
.tabs button{border:0;background:none;padding:6px 14px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:600}.tabs button.on{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
.qf{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 10px}
.qf button{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13px}
.qf button b{margin-left:4px}.qf button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.toolbar input{flex:1 1 260px}.toolbar select{flex:0 1 190px}
.plist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:10px}
.prow{display:grid;grid-template-columns:44px minmax(0,1.6fr) minmax(0,1.1fr) minmax(0,1fr) 150px;gap:14px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;background:var(--panel)}
.prow:last-child{border-bottom:0}.prow:hover{background:var(--panel2)}
@media (max-width:980px){.prow{grid-template-columns:40px minmax(0,1fr) 130px}.prow .c-company,.prow .c-contact{display:none}}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;color:#fff;flex:none}
.pname{font-weight:600;display:flex;gap:6px;align-items:center;flex-wrap:wrap}.pname a{color:inherit;text-decoration:none}.pname a:hover{text-decoration:underline}
.sub{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:600;white-space:nowrap}
.b-ok{background:var(--ok-soft);color:var(--ok)}.b-warn{background:var(--warn-soft);color:var(--warn)}.b-bad{background:var(--bad-soft);color:var(--bad)}.b-soft{background:var(--soft);color:var(--ink)}
.email{display:flex;gap:6px;align-items:center;min-width:0}.email span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px}
.iconbtn{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:2px 7px;cursor:pointer;color:var(--muted);font-size:12px}.iconbtn:hover{color:var(--ink)}
select.status{border-radius:999px;padding:5px 10px;font-size:12px;font-weight:600;border:0}
.more{text-align:center;padding:12px}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;z-index:30}.scrim.on{display:block}
.drawer{position:fixed;top:0;right:0;height:100vh;width:min(520px,100vw);background:var(--panel);border-left:1px solid var(--line);box-shadow:var(--shadow2);z-index:31;transform:translateX(100%);transition:transform .2s ease;overflow:auto;visibility:hidden}
.drawer.on{transform:none;visibility:visible}.dhead{padding:20px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:1}
.dbody{padding:18px 22px;display:flex;flex-direction:column;gap:18px}.dsec h4{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.ev{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}.ev .k{font-weight:600;font-size:13px}.ev .s{font-size:12px;color:var(--muted);margin-top:4px}
.kv{display:grid;grid-template-columns:120px 1fr;gap:6px 10px;font-size:13px}.kv div:nth-child(odd){color:var(--muted)}
.ctable{width:100%;border-collapse:collapse;font-size:13px}.ctable td,.ctable th{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left}.ctable th{font-size:12px;color:var(--muted)}
.ctable tr.click{cursor:pointer}.ctable tr.click:hover{background:var(--panel2)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;display:none;z-index:50}
.ico.skipped,.ico.skipping{background:var(--panel2);border-style:dashed}
.ico.stopped{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.ico.questions{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.qcard{border:2px solid var(--accent)}.qitem{margin:14px 0}.qitem .q{font-weight:600}.qitem .why{font-size:12px;color:var(--muted);margin:2px 0 6px}
.qopts{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}.qopts button{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:3px 10px;cursor:pointer;font-size:12.5px}
.qopts button:hover{border-color:var(--accent)}.qitem textarea,.qcard textarea{min-height:44px}
.clar{font-size:12px;color:var(--muted);margin-top:4px}.clar b{color:var(--ink);font-weight:600}
.tgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:0 14px}
.checks{display:flex;flex-wrap:wrap;gap:6px}.checks label{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;cursor:pointer;font-size:12.5px}
.checks input{width:auto;margin:0}.checks label:has(input:checked){background:var(--soft);border-color:var(--accent)}
details.more{text-align:left;margin-top:14px;border:1px solid var(--line);border-radius:12px;padding:6px 14px 14px}details.more summary{padding:8px 0}
.hint{font-weight:400;color:var(--muted);font-size:12px;margin-left:6px}
.chead{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;margin-bottom:16px}.chead h1{font-size:22px}.chead p{margin:2px 0 0;max-width:640px}
.chead .right{margin-left:auto;display:flex;gap:10px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap}
.spin{width:12px;height:12px;border-radius:50%;border:2px solid var(--accent);border-top-color:transparent;animation:spin 1s linear infinite;display:inline-block}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:26px;line-height:1.15}.stat span{font-size:12px;color:var(--muted)}.stat.warn b{color:var(--warn)}
.csec{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:22px 2px 10px;font-weight:600}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}@media (max-width:420px){.cgrid{grid-template-columns:minmax(0,1fr)}}
.ccard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;min-width:0}
.ccard.off{background:var(--panel2);box-shadow:none}
.ccard .top{display:flex;gap:10px;align-items:flex-start}.ccard .top>div:first-child{min-width:0;flex:1}.ccard h3{font-size:15px}
.ckey{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--panel2);display:flex;flex-direction:column;gap:6px}
.ckey .l1{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.ckey .l1 .sp{margin-left:auto}
.ckey .big{font-size:20px;font-weight:700;line-height:1.2}.ckey .big small{font-size:12px;font-weight:400;color:var(--muted);margin-left:4px}
.ckey code,.ccard code{background:var(--soft);padding:1px 6px;border-radius:6px;font-size:12px}
.ckey .meta{font-size:12px;color:var(--muted)}.ckey .err{font-size:12px;color:var(--warn)}
.tag{font-size:10.5px;padding:1px 7px;border-radius:6px;background:var(--soft);color:var(--muted);cursor:help}
.tag.live{background:var(--ok-soft);color:var(--ok)}
.addrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.skel{height:92px;border-radius:14px;background:linear-gradient(90deg,var(--panel2),var(--soft),var(--panel2));background-size:200% 100%;animation:shim 1.4s linear infinite;border:1px solid var(--line)}
@keyframes shim{to{background-position:-200% 0}}
.attn{border-left:4px solid var(--warn);background:var(--warn-soft);border-radius:12px;padding:12px 14px;margin-bottom:6px}.attn b{display:block;margin-bottom:4px}.attn ul{margin:0;padding-left:18px}
.src{font-size:10.5px;padding:1px 6px;border-radius:6px;background:var(--soft);color:var(--muted);margin-left:6px}
.modal .card{max-height:92vh;overflow:auto}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;place-items:center;z-index:40;padding:16px}.modal .card{max-width:640px;width:100%}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">Enfolo Lead Finder<span>Find people to interview</span></div>
    <button class="btn" id="newbtn">+ New search</button>
    <div class="muted small" style="padding:6px 6px 0">Your searches</div>
    <div class="slist" id="slist"></div>
    <div class="sidefoot">
      <button class="btn ghost sm" id="themeBtn" title="Switch between system, light and dark theme"></button>
      <button class="linkbtn" id="creditsLink">Free credits</button>
    </div>
  </aside>
  <section class="content" id="view"></section>
</div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Person details"></aside>
<div class="modal" id="modal"><div class="card" id="modalBody"></div></div>
<div class="toast" id="toast"></div>
<script>
const $ = s => document.querySelector(s);
const esc = s => (s ?? "").toString().replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const api = async (path, opt = {}) => {
  const r = await fetch(path, {...opt, headers: {"Content-Type":"application/json","X-Requested-With":"leadfinder"}});
  if (!r.ok) { const t = (await r.text()).replace(/<[^>]+>/g," ").replace(/\s+/g," ").trim(); toast(t.slice(0,220)); throw new Error(t); }
  return r.json();
};
const toast = m => { const t = $("#toast"); t.textContent = m; t.style.display = "block"; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = "none", 3200); };
const store = { get: k => { try { return localStorage.getItem("lf2_"+k); } catch { return null; } }, set: (k,v) => { try { localStorage.setItem("lf2_"+k, v); } catch {} } };
const S = { view: store.get("view") || "new", slug: store.get("slug"), searches: [], leads: [], showLog: false,
            qf: "all", q: "", icp: "", sort: "best", limit: 50, tab: "people", company: null, openPid: null };
const ago = t => { if (!t) return ""; const s = (Date.now() - Date.parse(t)) / 1000; return s < 90 ? "just now" : s < 5400 ? Math.round(s/60) + " min ago" : s < 129600 ? Math.round(s/3600) + " h ago" : Math.round(s/86400) + " days ago"; };
const dur = s => s == null ? "" : s < 90 ? `${s}s` : `${Math.round(s/60)} min`;
const copy = async (text, what) => { try { await navigator.clipboard.writeText(text); toast(`${what} copied`); } catch { prompt(`Copy ${what.toLowerCase()}:`, text); } };

// ---------- theme ----------
const THEMES = ["system", "light", "dark"], THEME_LABEL = {system:"Theme: System", light:"Theme: Light", dark:"Theme: Dark"};
function applyTheme(t){ if (t === "system") delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = t; $("#themeBtn").textContent = THEME_LABEL[t]; }
let theme = store.get("theme") || "system"; applyTheme(theme);
$("#themeBtn").onclick = () => { theme = THEMES[(THEMES.indexOf(theme) + 1) % 3]; store.set("theme", theme); applyTheme(theme); };

// ---------- sidebar ----------
async function loadSearches(){
  S.searches = await api("/api/searches");
  $("#slist").innerHTML = S.searches.map(s => {
    const running = s.running_job, asks = s.stages.some(x => x.status === "questions"), attn = s.stages.some(x => ["failed","warn"].includes(x.status)), done = s.stages.every(x => ["done","skipped"].includes(x.status));
    const st = running ? `<span class="warn">● running</span>` : asks ? `<span class="warn">? needs your answers</span>` : attn ? `<span class="warn">needs a look</span>` : done ? `<span class="ok">✓ ready</span>` : `<span class="muted">not run</span>`;
    return `<div class="sitem ${S.view==="search"&&S.slug===s.slug?"on":""}" data-s="${s.slug}"><b>${esc(s.name)}</b><small>${st} · ${s.people} people · ${s.emails} emails</small></div>`;
  }).join("") || `<div class="muted small" style="padding:6px">No searches yet.</div>`;
  document.querySelectorAll(".sitem").forEach(el => el.onclick = () => go("search", el.dataset.s));
}
function go(view, slug){ S.view = view; if (slug && slug !== S.slug) { S.slug = slug; S.qf = "all"; S.q = ""; S.icp = ""; S.company = null; S.tab = "people"; S.limit = 50; }
  S.showLog = false; store.set("view", view); if (slug) store.set("slug", slug); closeDrawer(); loadSearches(); render(); }
$("#newbtn").onclick = () => go("new");
$("#creditsLink").onclick = () => go("credits");

// ---------- new search ----------
const EXAMPLES = [
  "Purchase heads and procurement managers at auto-component manufacturers who visit machine-tool trade shows",
  "Sales heads and export managers at Indian packaging-machinery makers that exhibit at 3+ trade shows a year",
  "Key account and field sales managers selling industrial equipment on long, multi-month deals",
];
function depthChoice(cur){ return `<div class="choice" id="depth">
  <label class="${cur!=="deep"?"on":""}"><input type="radio" name="d" value="routine" ${cur!=="deep"?"checked":""}><b>Standard</b><div class="small muted">Sonnet 5, low effort. Recommended for routine runs.</div></label>
  <label class="${cur==="deep"?"on":""}"><input type="radio" name="d" value="deep" ${cur==="deep"?"checked":""}><b>Deep research</b><div class="small muted">Opus, high effort. Slower, uses more of your Claude plan.</div></label></div>`; }
function bindDepth(){ document.querySelectorAll("#depth input").forEach(r => r.onchange = () => document.querySelectorAll("#depth label").forEach(l => l.classList.toggle("on", l.querySelector("input").checked))); }
// ---------- targeting (who / where) ----------
const joinL = a => (a || []).join(", ");
function targetFields(t){
  const moreOpen = ["titles","exclude_titles","sectors","seniority","functions","headcount","exclude_locations","company_rule"].some(k => (t[k]||"").length);
  return `<div class="tgrid">
      <div><label class="f">Countries <span class="hint">comma-separated</span></label><input id="t_countries" value="${esc(joinL(t.countries))}" placeholder="India, UAE"></div>
      <div><label class="f">Focus cities / hubs <span class="hint">optional</span></label><input id="t_cities" value="${esc(joinL(t.cities))}" placeholder="Pune, Chennai, Ahmedabad"></div></div>
    <details class="more" ${moreOpen?"open":""}><summary>More control over the people <span class="hint">all optional; empty = the description decides</span></summary>
      <div class="tgrid">
        <div><label class="f">Job titles to include</label><input id="t_titles" value="${esc(joinL(t.titles))}" placeholder="Purchase Head, Procurement Manager"></div>
        <div><label class="f">Exclude titles / words</label><input id="t_exclude_titles" value="${esc(joinL(t.exclude_titles))}" placeholder="intern, trainee, HR"></div>
        <div><label class="f">Company sectors</label><input id="t_sectors" value="${esc(joinL(t.sectors))}" placeholder="auto components, forging"></div>

function targetSummary(t){

// ---------- search: header + progress ----------
const ICON = {done:"✓", failed:"!", warn:"!", skipped:"↷", skipping:"↷", stopped:"❚❚", questions:"?"};
function stageText(st){
  const d = st.detail || {};
  if (st.status === "skipped" || st.status === "skipping") return `<span class="muted">${st.status === "skipping" ? "Skipping…" : esc(d.note || "Skipped by you.")}</span>`;
  if (st.status === "stopped") return `<span class="warn">${esc(d.note || "Stopped. Resume continues from here.")}</span>`;
  if (st.status === "failed") return `<span class="bad">${esc(d.error || "failed")}</span>`;
  if (st.status === "questions") return `<span class="warn">Has ${(d.questions||[]).length} question(s) for you (see above)</span>`;
  if (st.status !== "done" && st.status !== "warn") return "";
  if (d.warning) return `<span class="warn">${esc(d.warning)}</span>` + (d.note ? `<br>${esc(d.note)}` : "");
  if (d.skipped) return esc(d.skipped);
  const k = st.key;
  if (k === "persona") return esc((d.icps||[]).join(" · ") || d.note || "");
  if (k === "research") return `${d.shows ?? 0} shows · ${d.companies ?? 0} companies`;
  if (k === "evidence") return `companies at ${d.min_shows_wanted ?? 3}+ shows: ${d.companies_at_n_before ?? 0} → ${d.companies_at_n_after ?? 0}` + ((d.thin_shows_after||[]).length ? ` · lists still missing: ${esc(d.thin_shows_after.join(", "))}` : "");
  if (k === "attendees") return d.skipped ? esc(d.skipped) : Object.entries(d.shows||{}).map(([n,v]) => `${esc(n)}: ${esc(v)}`).join(" · ");
  if (k === "summary") return d.by === "fallback" ? "Written without Sonnet (it could not be reached)" : "See the summary above";
  if (k === "linkedin") return (d.note ? esc(d.note) + " · " : "") + Object.entries(d).filter(([,v]) => typeof v === "object").map(([c,v]) => `${(v.people_added_or_matched ?? v.title_searches_planned ?? 0) + (v.aiark_for_unresolved?.people_added_or_matched || 0) + (v.deepline?.people_added_or_matched || 0) + (v.paid_for_rest?.people_added_or_matched || 0) + (v.paid_for_rest?.aiark_for_unresolved?.people_added_or_matched || 0)} people`).join(" · ");
  if (k === "web") return `${d.done ?? 0} searches · ${d.people_added ?? 0} people` + (d.companies_total != null
    ? ` · ${d.companies_searched ?? 0} of ${d.companies_total} companies searched (the rest don't pass the persona's company rule${d.min_shows ? `, e.g. exhibits at ${d.min_shows}+ shows` : ""}, or are still queued)` : "");
  if (k === "verify") return d.checked != null ? `${d.checked} checked · ${d.flagged ?? 0} flagged` : esc(d.note || "");
  if (k === "emails") return `${d.found ?? 0} emails found of ${d.tried ?? 0} tried`;
  if (k === "export") return `${d.leads ?? 0} people ready`;
  return "";
}
function summaryText(s){
  const st = s.stages.find(x => x.key === "summary");
  const t = st && ["done","warn"].includes(st.status) && st.detail?.text;
  if (!t) return "";
  // plain text from Sonnet: keep line breaks, bold the section labels
  return esc(t).replace(/^(Done|Bottleneck|Next):/gm, "<b>$1:</b>");
}

const STATUSES = ["new","contacted","replied","interview booked","interviewed","not interested","wrong person"];
const STATUS_CLS = {"new":"b-soft","contacted":"b-warn","replied":"b-warn","interview booked":"b-ok","interviewed":"b-ok","not interested":"b-bad","wrong person":"b-bad"};
const KIND = {exhibitor:"Exhibited at", visitor_post:"Posted about visiting", thanked_by_exhibitor:"Tagged by an exhibitor at", order:"Ordered at",
  delegation:"In a delegation to", speaker:"Spoke at", buyer_meet:"At a buyer-seller meet", report_named:"Named in the show report of", matchmaking:"Matchmaking at",
  app_attendee:"Event-app attendee at", testimonial:"Quoted at", profile_inferred:"Fits the visitor profile of", linkedin_profile:"LinkedIn profile"};
const CONF = {confirmed:["Seen at a show","b-ok"], likely:["Company at a show","b-warn"], inferred:["Profile match","b-soft"]};
const initials = n => (n||"?").replace(/[^A-Za-z\s]/g,"").trim().split(/\s+/).slice(0,2).map(w => w[0]).join("").toUpperCase() || "?";
const avColor = n => `hsl(${[...(n||"x")].reduce((a,c) => a + c.charCodeAt(0), 0) % 360} 45% 46%)`;
const QF = {all: () => true, email: l => !!l.email, seen: l => l.confidence === "confirmed", todo: l => !l.tracker.status || l.tracker.status === "new"};

async function loadResults(){ S.leads = await api(`/api/industries/${S.slug}/leads`); drawResults(); }
function filtered(){
  const q = S.q.toLowerCase();
  const rows = S.leads.filter(l => !l.profile_flag && QF[S.qf](l) && (!S.icp || l.icp === S.icp) && (!S.company || l.company === S.company)
    && (!q || `${l.name} ${l.title} ${l.company} ${l.location||""}`.toLowerCase().includes(q)));
  const by = {best: (a,b) => b.score - a.score, name: (a,b) => a.name.localeCompare(b.name), company: (a,b) => (a.company||"").localeCompare(b.company||"") || b.score - a.score,
    status: (a,b) => STATUSES.indexOf(b.tracker.status||"new") - STATUSES.indexOf(a.tracker.status||"new") || b.score - a.score};
  return rows.sort(by[S.sort]);
}

  const base = S.leads.filter(l => !l.profile_flag), flagged = S.leads.length - base.length;
  const cnt = k => base.filter(QF[k]).length, icps = [...new Set(S.leads.map(l => l.icp))];
  const shown = filtered(), nPeople = shown.length, nCos = new Set(shown.map(l => l.company)).size;
  el.innerHTML = `<div class="row" style="align-items:center"><h3 style="flex:0;white-space:nowrap">Results</h3>
      <div style="flex:0" class="tabs"><button data-tab="people" class="${S.tab==="people"?"on":""}">People <span class="muted">${nPeople}</span></button><button data-tab="companies" class="${S.tab==="companies"?"on":""}">Companies <span class="muted">${nCos}</span></button></div>
      <div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn ghost sm" id="copyEmails">Copy emails</button></div></div>
    <div class="qf">${[["all","All"],["email","With email"],["seen","Seen at a show"],["todo","Not contacted yet"]].map(([k,l]) => `<button data-qf="${k}" class="${S.qf===k?"on":""}">${l}<b>${cnt(k)}</b></button>`).join("")}</div>
    <div class="toolbar"><input id="q" placeholder="Search name, title, company, city…" value="${esc(S.q)}">
      ${icps.length > 1 ? `<select id="fi"><option value="">All personas</option>${icps.map(x => `<option value="${esc(x)}" ${S.icp===x?"selected":""}>${esc((S.cur.icps.find(i => i.code===x)||{}).name || x)}</option>`).join("")}</select>` : ""}
      <select id="sort">${[["best","Best match first"],["company","By company"],["name","By name"],["status","By status"]].map(([k,l]) => `<option value="${k}" ${S.sort===k?"selected":""}>${l}</option>`).join("")}</select></div>
    ${S.company ? `<div class="banner" style="margin:10px 0 0">Showing people at <b>${esc(S.company)}</b> <button class="btn ghost sm" id="clearCo">Show everyone</button></div>` : ""}
    <div id="rbody"></div>
    ${flagged ? `<div class="small muted" style="margin-top:8px">${flagged} people hidden because their profile check flagged them (outside the region or moved company). They're still in the Excel file.</div>` : ""}`;
  document.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => { S.tab = b.dataset.tab; drawResults(); });
  document.querySelectorAll("[data-qf]").forEach(b => b.onclick = () => { S.qf = b.dataset.qf; S.limit = 50; drawResults(); });
  $("#q").oninput = e => { S.q = e.target.value; S.limit = 50; drawBody(); };
  if ($("#fi")) $("#fi").onchange = e => { S.icp = e.target.value; drawBody(); };
  $("#sort").onchange = e => { S.sort = e.target.value; drawBody(); };
  if ($("#clearCo")) $("#clearCo").onclick = () => { S.company = null; drawResults(); };
  $("#copyEmails").onclick = () => { const em = filtered().filter(l => l.email).map(l => l.email); em.length ? copy(em.join(", "), `${em.length} emails`) : toast("No emails in this view yet"); };
  drawBody();
}
function drawBody(){
  const b = $("#rbody"); if (!b) return;
  if (S.tab === "companies") return drawCompanies(b);
  const rows = filtered();
  if (!rows.length) { b.innerHTML = `<div class="empty">Nobody matches these filters.</div>`; return; }
  b.innerHTML = `<div class="plist">${rows.slice(0, S.limit).map(l => {
      const [cl, cc] = CONF[l.confidence] || ["", "b-soft"], st = l.tracker.status || "new";
      return `<div class="prow" data-pid="${l.id}">
        <div class="av" style="background:${avColor(l.name)}">${esc(initials(l.name))}</div>
        <div style="min-width:0"><div class="pname">${l.linkedin_url?`<a href="${esc(l.linkedin_url)}" target="_blank" rel="noopener" title="Open LinkedIn">${esc(l.name)} ↗</a>`:esc(l.name)}
            <span class="badge ${cc}">${cl}</span></div>
          <div class="sub" title="${esc(l.title)}">${esc(l.title||"")}</div></div>
        <div class="c-company" style="min-width:0"><div style="font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(l.company)}</div><div class="sub">${esc(l.location||l.country||"")}</div></div>
        <div class="c-contact" style="min-width:0">${l.email?`<div class="email"><span title="${esc(l.email)}">${esc(l.email)}</span><button class="iconbtn" data-copy="${esc(l.email)}" title="Copy email">⧉</button></div>
            <div class="sub ${l.email_status==="verified"?"ok":"warn"}">${l.email_status==="verified"?"✓ verified":esc(l.email_status||"")}</div>`:`<span class="sub">No email yet</span>`}</div>
        <div><select class="status badge ${STATUS_CLS[st]}" data-status="${l.id}" aria-label="Status">${STATUSES.map(x => `<option ${st===x?"selected":""}>${x}</option>`).join("")}</select></div>
      </div>`; }).join("")}</div>
    ${rows.length > S.limit ? `<div class="more"><button class="btn ghost" id="more">Show ${Math.min(50, rows.length - S.limit)} more of ${rows.length - S.limit}</button></div>` : `<div class="small muted" style="margin-top:8px">${rows.length} people · click anyone for details and evidence</div>`}`;
  if ($("#more")) $("#more").onclick = () => { S.limit += 50; drawBody(); };
  b.querySelectorAll(".prow").forEach(r => r.onclick = e => { if (e.target.closest("a,button,select")) return; openPerson(+r.dataset.pid); });
  b.querySelectorAll("[data-copy]").forEach(x => x.onclick = () => copy(x.dataset.copy, "Email"));
  b.querySelectorAll("[data-status]").forEach(x => x.onchange = () => saveTracker(+x.dataset.status, {status: x.value}));
}
function drawCompanies(b){
  const by = {};
  filtered().forEach(l => { const c = by[l.company] ||= {name: l.company, people: 0, emails: 0, seen: 0, shows: l.shows, best: 0}; c.people++; if (l.email) c.emails++; if (l.confidence==="confirmed") c.seen++; c.best = Math.max(c.best, l.score); });
  const rows = Object.values(by).sort((a,b) => b.best - a.best || b.people - a.people);
  b.innerHTML = rows.length ? `<div class="small muted" style="margin-top:10px">${rows.length} ${rows.length === 1 ? "company" : "companies"}</div><div style="overflow:auto;margin-top:6px"><table class="ctable"><thead><tr><th>Company</th><th>People</th><th>With email</th><th>Seen at a show</th><th>Trade shows</th></tr></thead><tbody>
    ${rows.map(c => `<tr class="click" data-co="${esc(c.name)}"><td><b>${esc(c.name)}</b></td><td>${c.people}</td><td>${c.emails}</td><td>${c.seen}</td><td class="small muted">${esc(c.shows||"")}</td></tr>`).join("")}
    </tbody></table></div><div class="small muted" style="margin-top:8px">Click a company to see its people.</div>` : `<div class="empty">Nobody matches these filters.</div>`;
  b.querySelectorAll("[data-co]").forEach(r => r.onclick = () => { S.company = r.dataset.co; S.tab = "people"; drawResults(); });
}
async function saveTracker(pid, patch){
  const l = S.leads.find(x => x.id === pid); if (l) Object.assign(l.tracker, patch);
  await api(`/api/tracker/${pid}`, {method:"PATCH", body: JSON.stringify(patch)}); toast("Saved");
  if ("status" in patch) drawResults();
}

// ---------- person drawer ----------
function closeDrawer(){ $("#drawer").classList.remove("on"); $("#scrim").classList.remove("on"); S.openPid = null; }
$("#scrim").onclick = closeDrawer;
document.addEventListener("keydown", e => { if (e.key === "Escape") { closeDrawer(); $("#modal").style.display = "none"; } });
async function openPerson(pid){
  S.openPid = pid; const lead = S.leads.find(x => x.id === pid);
  $("#drawer").innerHTML = `<div class="dhead"><div class="muted small">Loading…</div></div>`; $("#drawer").classList.add("on"); $("#scrim").classList.add("on");
  const p = await api(`/api/people/${pid}`); const st = p.tracker.status || "new";
  const [cl, cc] = CONF[lead?.confidence] || ["", "b-soft"];
  const g = "https://www.google.com/search?q=" + encodeURIComponent(`"${p.name}" "${p.company?.name || ""}"`);
  $("#drawer").innerHTML = `<div class="dhead"><div style="display:flex;gap:12px;align-items:center">
      <div class="av" style="background:${avColor(p.name)};width:48px;height:48px">${esc(initials(p.name))}</div>
      <div style="flex:1;min-width:0"><h2 style="font-size:18px">${esc(p.name)}</h2><div class="small">${esc(p.title||"")}</div>
        <div class="small muted">${esc(p.company?.name||"")}${p.location?" · "+esc(p.location):""}</div></div>
      <button class="iconbtn" id="dclose" title="Close (Esc)">✕</button></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">
      ${p.linkedin_url?`<a class="btn sm" href="${esc(p.linkedin_url)}" target="_blank" rel="noopener">Open LinkedIn ↗</a>`:""}
      ${p.email?`<button class="btn sm ghost" id="dcopy">Copy email</button><a class="btn sm ghost" href="mailto:${esc(p.email)}">Email</a>`:""}
      <a class="btn sm ghost" href="${g}" target="_blank" rel="noopener">Google ↗</a></div></div>
    <div class="dbody">
      <div class="dsec"><h4>Status</h4><div class="row"><select id="dstatus">${STATUSES.map(x => `<option ${st===x?"selected":""}>${x}</option>`).join("")}</select>
        <input type="date" id="dint" value="${esc(p.tracker.interview_date||"")}" title="Interview date"></div>
        <textarea id="dnotes" placeholder="Notes: what they said, when to follow up…" style="margin-top:8px;min-height:80px">${esc(p.tracker.notes||"")}</textarea></div>
      <div class="dsec"><h4>Why this person</h4><div><span class="badge ${cc}">${cl}</span> <span class="small">${esc(lead?.why||"")}</span></div>
        ${p.profile_flag?`<div class="badge b-bad" style="margin-top:6px">${esc(p.profile_flag)}</div>`:""}</div>
      <div class="dsec"><h4>Contact</h4><div class="kv">
        <div>Email</div><div>${p.email?`${esc(p.email)} <span class="small ${p.email_status==="verified"?"ok":"warn"}">${esc(p.email_status||"")}</span> <span class="small muted">via ${esc(p.email_source||"")}</span>`:"Not found yet"}</div>
        <div>LinkedIn</div><div>${p.linkedin_url?`<a href="${esc(p.linkedin_url)}" target="_blank" rel="noopener">profile ↗</a>`:"—"}</div>
        <div>Location</div><div>${esc(p.location||p.country||"—")}</div></div></div>
      <div class="dsec"><h4>Company</h4><div class="kv">
        <div>Name</div><div>${esc(p.company?.name||"")}</div>
        <div>Trade shows</div><div>${p.company?.exhibitor_at?.length ? esc(p.company.exhibitor_at.join(", ")) + (p.company.shows_12mo ? ` <span class="small muted">(${p.company.shows_12mo} in 12 months)</span>` : "") : "—"}</div>
        <div>Website</div><div>${p.company?.domain?`<a href="https://${esc(p.company.domain)}" target="_blank" rel="noopener">${esc(p.company.domain)} ↗</a>`:"—"}</div>
        <div>LinkedIn page</div><div>${p.company?.linkedin_url?`<a href="${esc(p.company.linkedin_url)}" target="_blank" rel="noopener">open ↗</a>`:"—"}</div></div></div>
      <div class="dsec"><h4>Evidence (${p.evidence.length})</h4>${p.evidence.map(e => `<div class="ev"><div class="k">${esc(KIND[e.kind]||e.kind)} ${esc(e.show||"")}
          <span class="badge ${e.confidence==="confirmed"?"b-ok":e.confidence==="likely"?"b-warn":"b-soft"}" style="float:right">${esc(e.confidence)}</span></div>
          <div class="small muted">${e.entity==="company"?"About the company":"About this person"}</div>
          ${e.snippet?`<div class="s">${esc(e.snippet.slice(0,300))}</div>`:""}
          ${e.url?`<div class="s"><a href="${esc(e.url)}" target="_blank" rel="noopener">source ↗</a></div>`:""}</div>`).join("") || `<div class="muted small">No evidence recorded.</div>`}</div>
    </div>`;
  $("#dclose").onclick = closeDrawer;
  if ($("#dcopy")) $("#dcopy").onclick = () => copy(p.email, "Email");
  $("#dstatus").onchange = e => saveTracker(pid, {status: e.target.value});
  $("#dint").onchange = e => saveTracker(pid, {interview_date: e.target.value});
  $("#dnotes").onchange = e => saveTracker(pid, {notes: e.target.value});
}

// ---------- credits ----------
// The server answers from its last balance sweep at once (and says `refreshing` while it re-reads in the background).
const credNum = v => typeof v === "number" ? v : (typeof v === "string" && /^\$?[\d,.]+$/.test(v.trim())) ? parseFloat(v.replace(/[$,]/g, "")) : null;
let credTimer = null;
function credKey(k){
  const empty = credNum(k.remaining) === 0;
  const state = k.resting_until ? `<span class="badge b-warn" title="Rate limited or out of credits; the next key takes over automatically">Resting until ${esc(k.resting_until.replace("T"," ").slice(0,16))} UTC</span>`
    : empty ? `<span class="badge b-bad">Empty</span>` : `<span class="badge b-ok">Active</span>`;
  const src = k.source === "live" ? `<span class="tag live" title="Read from the provider's own account just now">live</span>`
    : k.source === "local" ? `<span class="tag" title="This provider has no balance API, so the tool counts its own use">counted</span>` : "";
  const rem = k.remaining != null ? `<div class="big">${esc(k.remaining)}<small>${esc(k.unit || "")}</small></div>` : `<div class="muted">Balance not available</div>`;
  const notes = [k.note].filter(Boolean).map(esc).join(" · ");
  return `<div class="ckey"><div class="l1"><span class="small muted">Key ${k.index} · <code>${esc(k.key)}</code></span>${state}<span class="sp">${src}</span></div>${rem}
    ${notes ? `<div class="meta">${notes}</div>` : ""}${k.error ? `<div class="err">⚠ ${esc(k.error)}</div>` : ""}
    <div class="meta">Used by this tool: ${k.used_today} today · ${k.used_month} this month</div></div>`;
}
function credCard(sv){
  const n = sv.keys.length;
  if (!n) return `<div class="ccard off"><div class="top"><div><h3>${esc(sv.label)}</h3><div class="small muted">${esc(sv.use)}</div></div><span class="badge b-soft">Not set up</span></div>
    <div class="small"><b>Free allowance:</b> ${esc(sv.free_allowance)}</div>
    <div class="addrow">Add <code>${esc(sv.env)}=your_key</code> to <code>.env</code> <button class="iconbtn" data-copy="${esc(sv.env)}=">Copy name</button></div></div>`;
  return `<div class="ccard"><div class="top"><div><h3>${esc(sv.label)}</h3><div class="small muted">${esc(sv.use)}</div></div><span class="badge b-ok">${n} ${n > 1 ? "keys" : "key"}</span></div>
    ${sv.keys.map(credKey).join("")}<div class="small muted">Free allowance: ${esc(sv.free_allowance)}</div></div>`;
}
function credPaint(d, busy){
  const on = d.services.filter(x => x.keys.length);
  const keys = on.flatMap(x => x.keys.map(k => ({svc: x.label, k})));
  const resting = keys.filter(x => x.k.resting_until), empty = keys.filter(x => !x.k.resting_until && credNum(x.k.remaining) === 0);
  const errs = keys.filter(x => x.k.error && x.k.source !== "live");
  const issues = [...resting.map(x => `${esc(x.svc)} key ${x.k.index} is resting until ${esc(x.k.resting_until.replace("T"," ").slice(0,16))} UTC. The next key takes over automatically.`),
    ...empty.map(x => `${esc(x.svc)} key ${x.k.index} has no credits left.`),
    ...errs.map(x => `${esc(x.svc)} key ${x.k.index}: ${esc(x.k.error)}`)];
  const status = busy ? `<span class="pill"><span class="spin"></span>Checking every provider…</span>`
    : d.refreshing ? `<span class="pill"><span class="spin"></span>Updating…</span>` : `<span class="pill">Updated ${esc(ago(d.checked_at))}</span>`;
  const sp = d.openserp ? `<span class="badge b-ok">OpenSERP running</span>` : `<span class="badge b-soft" title="Self-hosted Google search, free, no key (docker)">OpenSERP not running</span>`;
  $("#view").innerHTML = `<div class="chead"><div><h1>Free credits</h1>
      <p class="muted">What is left on each free plan, so you know what a search can still afford. When a key runs out or is rate limited it rests and the next key takes over by itself.</p></div>
      <div class="right">${status}<button class="btn ghost sm" id="credRefresh" ${busy ? "disabled" : ""}>Refresh</button></div></div>
    <div class="stats"><div class="stat"><b>${on.length}<span style="font-weight:400"> / ${d.services.length}</span></b><span>services set up</span></div>
      <div class="stat"><b>${keys.length - resting.length - empty.length}</b><span>keys ready to use</span></div>
      <div class="stat ${resting.length + empty.length ? "warn" : ""}"><b>${resting.length + empty.length}</b><span>resting or empty</span></div>
      <div class="stat"><b>${sp}</b><span style="margin-top:6px;display:block">self-hosted search</span></div></div>
    ${issues.length ? `<div class="attn"><b>Needs a look</b><ul>${issues.map(i => `<li>${i}</li>`).join("")}</ul></div>` : ""}
    <div class="csec">In use (${on.length})</div><div class="cgrid">${on.map(credCard).join("") || `<div class="muted">No API keys found yet. Add some to <code>.env</code> below.</div>`}</div>
    <details class="more"><summary>How to add more keys</summary><p class="muted small">Put a key in the <code>.env</code> file next to the tool. For several keys on one service, separate them with commas
      (<code>SERPER_API_KEY=key1,key2</code>) or number them (<code>SERPER_API_KEY_2=…</code>). Restart the tool after editing <code>.env</code>.
      <span class="tag live">live</span> numbers come from the provider; <span class="tag">counted</span> means this tool counts its own use.</p></details>`;
  document.querySelectorAll("[data-copy]").forEach(b => b.onclick = () => copy(b.dataset.copy, "Name"));
  const rb = $("#credRefresh"); if (rb) rb.onclick = () => showCredits(true);
}
async function showCredits(refresh){
  clearTimeout(credTimer);
  if (S.credData) credPaint(S.credData, refresh);
  else $("#view").innerHTML = `<div class="chead"><div><h1>Free credits</h1><p class="muted"><span class="spin"></span> Checking balances with each provider…</p></div></div><div class="cgrid">${'<div class="skel"></div>'.repeat(6)}</div>`;
  try {
    const d = await api("/api/credits" + (refresh ? "?refresh=1" : ""));
    S.credData = d;
    if (S.view !== "credits") return;
    credPaint(d);
    if (d.refreshing) credTimer = setTimeout(() => { if (S.view === "credits") showCredits(); }, 2500);
  } catch (e) { if (S.view === "credits") { if (S.credData) credPaint(S.credData); else $("#view").innerHTML = `<div class="card bad">${esc(e.message).slice(0,300)}</div>`; } }
}

async function render(){
  const v = $("#view");
  try {
    if (S.view === "credits") { await showCredits(); return; }
    if (S.view === "search" && S.slug && S.searches.find(s => s.slug === S.slug)) { v.innerHTML = await viewSearch(); await bindSearch(); return; }
    v.innerHTML = viewNew(); bindNew();
  } catch (e) { v.innerHTML = `<div class="card bad">${esc(e.message).slice(0,300)}</div>`; }
}
async function tick(){
  if (S.view !== "search" || !S.slug || !S.cur) return;
  const s = await api(`/api/searches/${S.slug}`).catch(() => null); if (!s) return;
  const changed = JSON.stringify(s.stages) !== JSON.stringify(S.cur.stages) || (!!s.running_job) !== (!!S.cur.running_job);
  const busy = $("#modal").style.display === "grid" || $("#drawer").classList.contains("on") || document.activeElement?.matches("input,textarea,select");
  if (changed && !busy) { const keep = S.showLog; await loadSearches(); await render(); S.showLog = keep; }
  else if (S.showLog) refreshLog();
}
(async () => { await loadSearches(); if (S.view === "search" && !S.searches.find(s => s.slug === S.slug)) S.view = "new"; await render(); setInterval(tick, 4000); })();
</script>
</body>
</html>
